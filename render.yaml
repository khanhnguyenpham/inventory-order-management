services:
  - type: web
    name: kho-gon-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_DATABASE_PATH
        value: /tmp/inventory.db
      - key: APP_TOKEN_SECRET
        generateValue: true

